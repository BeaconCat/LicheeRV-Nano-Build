name: licheervnano-host-linux-amd64-cvi-mmf-sdk-ci

on:
  workflow_dispatch:

jobs:
  mksys:
    strategy:
      fail-fast: false

    runs-on: ubuntu-22.04

    steps:
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: "20G"
          create-symlink: true
          key: ${{matrix.os }}-${{ matrix.type }}

      - name: Create Timestamp
        run: |
              echo "BUILD_ID=$(date +%Y%m%d_%H%M%S)" >> $GITHUB_ENV
              echo "BUILD_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV

      - name: Install Software
        run: |
              sudo apt update && \
              sudo apt install -y build-essential autoconf automake autotools-dev ninja-build make help2man \
                                  libncurses-dev gawk flex bison openssl libssl-dev tree wget curl cmake ccache \
                                  libtool-bin bc bzr ca-certificates cmake cpio cvs file git locales mercurial \
                                  openssh-server python3 python3-flake8 python3-magic python3-nose2 python3-pexpect \
                                  python3-pytest rsync shellcheck subversion unzip pkg-config libssl-dev slib \
                                  squashfs-tools android-sdk-libsparse-utils rsync jq cmake python3-distutils \
                                  tclsh scons parallel ssh-client tree python3-dev python3-pip device-tree-compiler \
                                  libssl-dev ssh cpio squashfs-tools fakeroot libncurses5-dev flex bison mmdebstrap \
                                  android-libext4-utils bdebstrap proot fakeroot fakechroot python3 python3-flake8 \
                                  python3-nose2 python3-pexpect subversion unzip ccache picolibc-riscv64-unknown-elf\
                                  crossbuild-essential-riscv64 binutils-riscv64-unknown-elf\
                                  cpp-riscv64-linux-gnu g++-riscv64-linux-gnu gcc-riscv64-linux-gnu\
                                  libc6-dbg-riscv64-cross libatomic1-riscv64-cross libasan8-riscv64-cross\
                                  libc6-dev-riscv64-cross gcc-riscv64-unknown-elf gawk diffstat texinfo\
                                  chrpath socat python3-pip python3-pexpect xz-utils debianutils \
                                  iputils-ping python3-git python3-jinja2 libegl1-mesa libsdl1.2-dev \
                                  python3-subunit mesa-common-dev zstd liblz4-tool libacl1 parted erofs-utils \
                                  genext2fs mtools fatcat ckermit neovim cscope asciinema libconfuse-dev


      - name: Free disk space
        run: |
              sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup || true
              sudo docker image prune --all --force || true
              df -h /

      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
            path: 'cvi_mmf_sdk'  # TODO: make this name a global variable
            ref: 'NanoKVM'

      - name: Download Toolchain
        run: |
              export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
              pushd cvi_mmf_sdk
                wget https://sophon-file.sophon.cn/sophon-prod-s3/drive/23/03/07/16/host-tools.tar.gz
                tar xf host-tools.tar.gz
              popd

      - name: Make System
        run: |
              pushd cvi_mmf_sdk
                source build/cvisetup.sh
                defconfig sg2002_licheervnano_sd
                build_all

              popd

      - name: Assemble NanoKVM full image
        run: |
              set -e
              pushd cvi_mmf_sdk
                IMG=$(ls -t install/soc_sg2002_licheervnano_sd/images/*.img | head -1)
                echo "base image: $IMG"
                # kvmapp payload = official full package (prebuilt kvm_system + web + picoclaw app layer)
                curl -fsSL -o latest.zip https://cdn.sipeed.com/nanokvm/latest.zip
                rm -rf latest && unzip -q latest.zip
                LOOP=$(sudo losetup -fP --show "$IMG")
                echo "loop=$LOOP"
                mkdir -p mnt && sudo mount "${LOOP}p2" mnt
                echo "=== base /etc/init.d BEFORE (must contain rcS) ==="; ls mnt/etc/init.d

                # --- inject kvmapp ---
                sudo cp -r latest mnt/kvmapp
                sudo touch mnt/kvmapp/kvm_new_img          # first-boot init marker
                sudo chmod -R 755 mnt/kvmapp

                # --- default video/KVM config (created only if the package omits them) ---
                sudo install -d mnt/kvmapp/kvm
                set_default(){ [ -e "mnt/kvmapp/kvm/$1" ] || echo "$2" | sudo tee "mnt/kvmapp/kvm/$1" >/dev/null; }
                set_default fps 30
                set_default height 1080
                set_default now_fps 0
                set_default qlty 60
                set_default res 0
                set_default state 1
                set_default type mjpeg
                set_default width 1920

                # --- extra binaries ---
                sudo cp kvm/frp_0.59.0_linux_riscv64/frpc       mnt/usr/bin/
                sudo cp kvm/tailscale_1.80.2_riscv64/tailscale  mnt/usr/bin/
                sudo cp kvm/tailscale_1.80.2_riscv64/tailscaled mnt/usr/sbin/
                sudo chmod +x mnt/usr/bin/frpc mnt/usr/bin/tailscale mnt/usr/sbin/tailscaled

                # --- MIPI RX kernel module ---
                sudo mkdir -p mnt/mnt/system/ko
                sudo cp -f mnt/kvmapp/system/ko/soph_mipi_rx.ko mnt/mnt/system/ko/ || true

                # --- init.d OVERLAY (preserve base rcS; the package ships only S* scripts) ---
                sudo cp -f mnt/kvmapp/system/init.d/S* mnt/etc/init.d/
                sudo chmod +x mnt/etc/init.d/S* mnt/kvmapp/system/init.d/S*

                # --- kvm dirs; SSH left ON (no ssh_stop) to match the verified-bootable build ---
                sudo mkdir -p mnt/etc/kvm

                echo "=== version ===";  cat mnt/kvmapp/version 2>/dev/null || true
                echo "=== init.d ===";   ls mnt/etc/init.d
                echo "=== kvm cfg ===";  ls mnt/kvmapp/kvm
                sync; sudo umount mnt; sudo losetup -d "$LOOP"
                OUT="install/soc_sg2002_licheervnano_sd/images/${BUILD_DATE}_NanoKVM_selfbuilt_full.img"
                mv "$IMG" "$OUT"
                echo "full image: $OUT"; ls -lh "$OUT"
                echo "FULL_IMG=$OUT" >> "$GITHUB_ENV"
              popd

      - name: Verify full image
        run: |
              set -e
              pushd cvi_mmf_sdk
                LOOP=$(sudo losetup -fP --show "$FULL_IMG")
                mkdir -p vmnt && sudo mount -o ro "${LOOP}p2" vmnt
                M=vmnt
                fail=0
                ck(){ if eval "$2"; then printf '  OK   %s\n' "$1"; else printf '  FAIL %s\n' "$1"; fail=1; fi; }
                echo "=== critical checks ==="
                ck "rcS present (services boot)"        "[ -f $M/etc/init.d/rcS ]"
                ck "S95nanokvm executable"              "[ -x $M/etc/init.d/S95nanokvm ]"
                ck "kvm_system binary present"          "[ -s $M/kvmapp/kvm_system/kvm_system ]"
                ck "NanoKVM-Server present"             "[ -s $M/kvmapp/server/NanoKVM-Server ]"
                ck "server web UI present"              "[ -f $M/kvmapp/server/web/index.html ]"
                ck "dl_lib shared objects present"      "[ \$(ls $M/kvmapp/server/dl_lib/*.so 2>/dev/null | wc -l) -gt 0 ]"
                ck "soph_mipi_rx.ko installed"          "[ -f $M/mnt/system/ko/soph_mipi_rx.ko ]"
                ck "frpc executable"                    "[ -x $M/usr/bin/frpc ]"
                ck "tailscaled executable"              "[ -x $M/usr/sbin/tailscaled ]"
                ck "kvm_new_img first-boot marker"      "[ -e $M/kvmapp/kvm_new_img ]"
                echo "=== info ==="
                file -b "$M/kvmapp/server/NanoKVM-Server" || true
                echo "kvm cfg: $(ls $M/kvmapp/kvm | tr '\n' ' ')"
                ls $M/usr/bin/picoclaw 2>/dev/null && echo "picoclaw binary: present" || echo "NOTE: /usr/bin/picoclaw absent (S96picoclaw stays idle until provided)"
                sync; sudo umount vmnt; sudo losetup -d "$LOOP"
                [ "$fail" = 0 ] || { echo "IMAGE VERIFICATION FAILED"; exit 1; }
                echo "IMAGE VERIFICATION PASSED"
              popd

      - name: 'Upload Artifact'
        uses: actions/upload-artifact@v4
        if: always()
        with:
          retention-days: 30
          name: licheervnano-cvi-mmf-sdk-output-${{ env.BUILD_ID }}
          path: |
                  cvi_mmf_sdk/install/soc_sg2002_licheervnano_sd/images/*
                  cvi_mmf_sdk/install/soc_sg2002_licheervnano_sd/*.bin
