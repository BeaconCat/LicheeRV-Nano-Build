name: Build NanoKVM SD image (SG2002 / LicheeRV Nano)

# Builds the full bootable NanoKVM SD image: build_all produces the base rootfs,
# then the kvmapp payload (kvm_system + server + web + frpc/tailscale + mipi ko)
# is injected and the result is verified before upload.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: "20G"
          create-symlink: true
          key: licheervnano-nanokvm

      - name: Timestamp
        run: echo "BUILD_DATE=$(date +%Y%m%d)" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            android-libext4-utils android-sdk-libsparse-utils asciinema autoconf automake autotools-dev \
            bc bdebstrap binutils-riscv64-unknown-elf bison build-essential bzr \
            ca-certificates ccache chrpath ckermit cmake cpio \
            cpp-riscv64-linux-gnu crossbuild-essential-riscv64 cscope curl cvs debianutils \
            device-tree-compiler diffstat erofs-utils fakechroot fakeroot fatcat \
            file flex g++-riscv64-linux-gnu gawk gcc-riscv64-linux-gnu gcc-riscv64-unknown-elf \
            genext2fs git help2man iputils-ping jq libacl1 \
            libasan8-riscv64-cross libatomic1-riscv64-cross libc6-dbg-riscv64-cross libc6-dev-riscv64-cross libconfuse-dev libegl1-mesa \
            liblz4-tool libncurses-dev libncurses5-dev libsdl1.2-dev libssl-dev libtool-bin \
            locales make mercurial mesa-common-dev mmdebstrap mtools \
            neovim ninja-build openssh-server openssl parallel parted \
            picolibc-riscv64-unknown-elf pkg-config proot python3 python3-dev python3-distutils \
            python3-flake8 python3-git python3-jinja2 python3-magic python3-nose2 python3-pexpect \
            python3-pip python3-pytest python3-subunit rsync scons shellcheck \
            slib socat squashfs-tools ssh ssh-client subversion \
            tclsh texinfo tree unzip wget xz-utils zstd

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup || true
          sudo docker image prune -af || true
          df -h /

      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: cvi_mmf_sdk
          ref: NanoKVM

      - name: Download toolchain
        working-directory: cvi_mmf_sdk
        run: |
          wget -q https://sophon-file.sophon.cn/sophon-prod-s3/drive/23/03/07/16/host-tools.tar.gz
          tar xf host-tools.tar.gz

      - name: Build base system
        working-directory: cvi_mmf_sdk
        run: |
          source build/cvisetup.sh
          defconfig sg2002_licheervnano_sd
          build_all

      - name: Inject kvmapp payload
        working-directory: cvi_mmf_sdk
        run: |
          set -e
          IMG=$(ls -t install/soc_sg2002_licheervnano_sd/images/*.img | head -1)
          echo "base image: $IMG"
          curl -fsSL -o latest.zip https://cdn.sipeed.com/nanokvm/latest.zip
          rm -rf latest && unzip -q latest.zip

          LOOP=$(sudo losetup -fP --show "$IMG")
          mkdir -p mnt && sudo mount "${LOOP}p2" mnt

          # kvmapp
          sudo cp -r latest mnt/kvmapp
          sudo touch mnt/kvmapp/kvm_new_img          # first-boot init marker
          sudo chmod -R 755 mnt/kvmapp

          # default video/KVM config (only if the package omits it)
          sudo install -d mnt/kvmapp/kvm mnt/etc/kvm
          for kv in fps=30 height=1080 now_fps=0 qlty=60 res=0 state=1 type=mjpeg width=1920; do
            f=mnt/kvmapp/kvm/${kv%=*}
            [ -e "$f" ] || echo "${kv#*=}" | sudo tee "$f" >/dev/null
          done

          # frpc + tailscale
          sudo cp kvm/frp_0.59.0_linux_riscv64/frpc       mnt/usr/bin/
          sudo cp kvm/tailscale_1.80.2_riscv64/tailscale  mnt/usr/bin/
          sudo cp kvm/tailscale_1.80.2_riscv64/tailscaled mnt/usr/sbin/
          sudo chmod +x mnt/usr/bin/frpc mnt/usr/bin/tailscale mnt/usr/sbin/tailscaled

          # MIPI RX kernel module
          sudo mkdir -p mnt/mnt/system/ko
          sudo cp -f mnt/kvmapp/system/ko/soph_mipi_rx.ko mnt/mnt/system/ko/ || true

          # init.d: overlay the package's S* scripts, preserving the base rcS
          sudo cp -f mnt/kvmapp/system/init.d/S* mnt/etc/init.d/
          sudo chmod +x mnt/etc/init.d/S* mnt/kvmapp/system/init.d/S*

          sync; sudo umount mnt; sudo losetup -d "$LOOP"
          OUT="install/soc_sg2002_licheervnano_sd/images/${BUILD_DATE}_NanoKVM_full.img"
          mv "$IMG" "$OUT"
          echo "FULL_IMG=$OUT" >> "$GITHUB_ENV"
          ls -lh "$OUT"

      - name: Verify image
        working-directory: cvi_mmf_sdk
        run: |
          set -e
          LOOP=$(sudo losetup -fP --show "$FULL_IMG")
          mkdir -p vmnt && sudo mount -o ro "${LOOP}p2" vmnt
          M=vmnt fail=0
          ck() { if eval "$2"; then echo "  OK   $1"; else echo "  FAIL $1"; fail=1; fi; }
          ck "rcS present (services boot)"   "[ -f $M/etc/init.d/rcS ]"
          ck "S95nanokvm executable"         "[ -x $M/etc/init.d/S95nanokvm ]"
          ck "kvm_system binary"             "[ -s $M/kvmapp/kvm_system/kvm_system ]"
          ck "NanoKVM-Server"                "[ -s $M/kvmapp/server/NanoKVM-Server ]"
          ck "web UI"                        "[ -f $M/kvmapp/server/web/index.html ]"
          ck "dl_lib .so"                    "[ \$(ls $M/kvmapp/server/dl_lib/*.so 2>/dev/null | wc -l) -gt 0 ]"
          ck "soph_mipi_rx.ko"               "[ -f $M/mnt/system/ko/soph_mipi_rx.ko ]"
          ck "frpc"                          "[ -x $M/usr/bin/frpc ]"
          ck "tailscaled"                    "[ -x $M/usr/sbin/tailscaled ]"
          ck "kvm_new_img marker"            "[ -e $M/kvmapp/kvm_new_img ]"
          sync; sudo umount vmnt; sudo losetup -d "$LOOP"
          [ "$fail" = 0 ] && echo "IMAGE VERIFICATION PASSED" || { echo "IMAGE VERIFICATION FAILED"; exit 1; }

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 30
          name: nanokvm-image-${{ env.BUILD_DATE }}
          path: |
            cvi_mmf_sdk/install/soc_sg2002_licheervnano_sd/images/*
            cvi_mmf_sdk/install/soc_sg2002_licheervnano_sd/*.bin
